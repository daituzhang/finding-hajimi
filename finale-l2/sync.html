<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>· · ·</title>
  <link rel="icon" type="image/png" href="../shared/assets/favicon.png" />
  <link rel="stylesheet" href="../shared/styles/shared.css" />
  <style>
    body { background: #fff; color: #1f2937; margin: 0; min-height: 100vh;
      font-family: -apple-system, "PingFang SC", sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 20px; box-sizing: border-box;
      position: relative; overflow: hidden; }
    .sigil-bg {
      position: fixed; inset: 0;
      background: url('../shared/assets/sigil-final.png') center/min(80vmin, 720px) no-repeat;
      opacity: 0.08; pointer-events: none; z-index: 0;
      animation: pulse 6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.06; transform: scale(1); }
      50%      { opacity: 0.14; transform: scale(1.04); }
    }
    .pad { position: relative; z-index: 1; }
    .pad {
      max-width: 480px; width: 100%; text-align: center;
    }
    .ribbon {
      color: #cbd5e1; font-size: 11px; letter-spacing: 8px; margin-bottom: 28px;
    }
    .text-area {
      width: 100%; box-sizing: border-box;
      padding: 28px 18px; min-height: 160px;
      background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px;
      font-size: 22px; color: #1f2937; letter-spacing: 4px;
      line-height: 1.85; font-family: inherit;
      text-align: center;
    }
    .text-area:focus { outline: none; }
    .send-row {
      margin-top: 18px; display: flex; gap: 10px; align-items: center;
    }
    .send-row .hint {
      flex: 1; font-size: 11px; color: #94a3b8; text-align: left;
    }
    .send-btn {
      padding: 11px 22px; background: #cbd5e1; color: #64748b;
      border: 0; border-radius: 6px; font-size: 14px;
      font-family: inherit; letter-spacing: 2px; cursor: not-allowed;
    }
    .send-btn.active {
      background: #1e3a8a; color: #fff;
    }
    .status {
      margin-top: 18px; font-size: 12px; color: #94a3b8;
      letter-spacing: 1px; min-height: 16px;
    }
    .cursor {
      display: inline-block; width: 2px; height: 24px;
      background: #1f2937; vertical-align: -4px;
      animation: blink 1s steps(2) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* —— B 动画增强 —— */
    .ribbon { animation: ribbonIn 1.4s ease-out both; }
    .text-area {
      animation: padIn 0.9s ease-out 0.3s both;
      transition: box-shadow .8s, background .8s, color .8s;
    }
    .send-row { animation: padIn 0.9s ease-out 0.6s both; }
    @keyframes ribbonIn {
      0% { letter-spacing: 30px; opacity: 0; }
      100% { letter-spacing: 8px; opacity: 1; }
    }
    @keyframes padIn {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* “被接管”状态：输入框转冷色、不断发出同步脚光 */
    .text-area.locked {
      background: #eef2ff;
      box-shadow:
        0 0 0 1px #c7d2fe inset,
        0 0 40px -10px rgba(30,58,138,0.35);
      animation: lockedPulse 2.2s ease-in-out infinite;
    }
    @keyframes lockedPulse {
      0%, 100% { box-shadow: 0 0 0 1px #c7d2fe inset, 0 0 24px -10px rgba(30,58,138,0.25); }
      50% { box-shadow: 0 0 0 1px #818cf8 inset, 0 0 60px -8px rgba(30,58,138,0.55); }
    }

    /* 身份证 / 邀请卡式的“隐藏水印”：一念归一 / 万心同声。
       初始不可见，被 .revealed 启动后渐显 */
    .watermark {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image: repeating-linear-gradient(
        -28deg,
        transparent 0, transparent 90px,
        rgba(30,58,138,0.045) 90px, rgba(30,58,138,0.045) 220px
      );
      opacity: 0;
      transition: opacity 2s;
    }
    .watermark.revealed { opacity: 1; }
    .watermark::before {
      content: '一念归一 · 万心同声　　一念归一 · 万心同声　　一念归一 · 万心同声　　一念归一 · 万心同声　　一念归一 · 万心同声　　一念归一 · 万心同声';
      position: absolute; inset: 0;
      color: rgba(30,58,138,0.05); font-size: 22px; letter-spacing: 6px;
      line-height: 2.4; word-break: break-all;
      transform: rotate(-12deg); transform-origin: center;
    }

    /* 计数器“合鸣人数”跳数动画 */
    .counter {
      position: fixed; left: 0; right: 0; bottom: 22px; text-align: center;
      font-family: ui-monospace, monospace; font-size: 11px; letter-spacing: 2px;
      color: #94a3b8; z-index: 2; opacity: 0; transition: opacity 1s;
    }
    .counter.show { opacity: 1; }
    .counter b { color: #1e3a8a; font-size: 13px; font-weight: 700; }

    /* 调个心跳样的同步脉冲，从中心向外扩散 */
    .pulse-ring {
      position: fixed; left: 50%; top: 50%;
      width: 100px; height: 100px; margin: -50px 0 0 -50px;
      border-radius: 50%;
      border: 2px solid rgba(30,58,138,0.35);
      pointer-events: none; z-index: 1;
      opacity: 0;
    }
    .pulse-ring.go { animation: ring 2.8s ease-out infinite; }
    .pulse-ring.go.r2 { animation-delay: 0.9s; }
    .pulse-ring.go.r3 { animation-delay: 1.8s; }
    @keyframes ring {
      0% { transform: scale(0.4); opacity: 0.6; border-width: 3px; }
      100% { transform: scale(8); opacity: 0; border-width: 1px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="sigil-bg"></div>
  <div class="watermark" id="watermark"></div>
  <div class="pulse-ring" id="ring1"></div>
  <div class="pulse-ring r2" id="ring2"></div>
  <div class="pulse-ring r3" id="ring3"></div>
  <div class="counter" id="counter"><b>0</b> 人正在说出同一句话</div>
  <div class="pad">
    <div class="ribbon">━━ ENDING · B ━━</div>

    <div class="text-area" id="ta" contenteditable="true" spellcheck="false"><span id="content"></span><span class="cursor"></span></div>

    <div class="send-row">
      <div class="hint">输入后点击发送 · 让世界听见你的心声</div>
      <button class="send-btn" id="sendBtn">发送</button>
    </div>

    <div class="status" id="status"></div>
    <div style="margin-top:40px;text-align:center;">
      <a href="../about-author/" style="color:#94a3b8;font-size:11px;letter-spacing:2px;text-decoration:none;border-bottom:1px dashed #cbd5e1;padding-bottom:2px;">作者有话说 ›</a>
    </div>
  </div>

  <script type="module">
    import { mountFooter } from '../shared/components/page-footer.js';
    mountFooter({ page: 47, total: 47, keywords: ['END·B'] });

    const ta = document.getElementById('ta');
    const content = document.getElementById('content');
    const sendBtn = document.getElementById('sendBtn');
    const status = document.getElementById('status');

    // 1. 玩家无法编辑
    ta.addEventListener('beforeinput', e => e.preventDefault());
    ta.addEventListener('paste', e => e.preventDefault());
    ta.addEventListener('keydown', e => e.preventDefault());

    // 2. 自动逐字打 "一念归一·万心同声"
    const target = '一念归一·万心同声';
    let i = 0;
    const tick = setInterval(() => {
      content.textContent = target.slice(0, i + 1);
      i++;
      if (i >= target.length) {
        clearInterval(tick);
        sendBtn.classList.add('active');
        sendBtn.style.cursor = 'pointer';
        status.textContent = '你的声音正在升起 · · ·';
        setTimeout(autoSend, 1400);
      }
    }, 380);

    function autoSend() {
      sendBtn.click();
    }

    sendBtn.addEventListener('click', () => {
      if (!sendBtn.classList.contains('active')) return;
      sendBtn.disabled = true;
      // 上锁 · 水印 · 脉冲 · 计数器
      ta.classList.add('locked');
      document.getElementById('watermark').classList.add('revealed');
      ['ring1','ring2','ring3'].forEach(id => document.getElementById(id).classList.add('go'));
      const counterEl = document.getElementById('counter');
      const counterNum = counterEl.querySelector('b');
      counterEl.classList.add('show');
      let cn = 0;
      const target = 218400000;
      const counterTick = setInterval(() => {
        cn = Math.min(target, cn + Math.floor(target / 80 + Math.random() * (target / 60)));
        counterNum.textContent = cn.toLocaleString('en-US');
        if (cn >= target) clearInterval(counterTick);
      }, 80);

      const lines = [
        '✓ 你的心声已汇入合唱',
        '✓ 北京 · 4,231,008 人 同时说出了同一句话',
        '✓ 上海 · 6,907,442 人 以同一个节奏呈吼吸',
        '✓ 广州 · 成都 · 杭州 · 西安 · 不再有异议',
        '✓ 全国 218,400,000 人 · 同一句话 · 同一个愿望',
        '✓ 不再有人走丢',
        '✓ 不再有人被遗忘',
        '✓ 不再有人独自哭泣',
        '一念归一 · 万心同声',
      ];
      let n = 0;
      status.textContent = lines[0];
      setInterval(() => {
        n = (n + 1) % lines.length;
        status.textContent = lines[n];
      }, 1800);
    });
  </script>
</body>
</html>
