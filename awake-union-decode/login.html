<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>decode.awake-union.org · 验证码门</title>
  <link rel="icon" type="image/png" href="../shared/assets/favicon.png" />
  <link rel="stylesheet" href="../shared/styles/shared.css" />
  <style>
    body { background: #050414; color: #c4b5fd; margin: 0;
      font-family: ui-monospace, "PingFang SC", monospace; min-height: 100vh; }
    .wrap { max-width: 420px; margin: 70px auto; padding: 0 22px; }
    .head {
      text-align: center; color: #a78bfa; padding: 18px;
      border: 1px solid #4c1d95; border-radius: 6px;
      background: rgba(139,92,246,0.06); letter-spacing: 1px;
    }
    .head .lg { font-size: 18px; color: #c4b5fd; font-weight: 700; letter-spacing: 2px; }
    .head .sub { font-size: 11px; color: #8b5cf6; margin-top: 6px; }

    h1 { color: #c4b5fd; font-size: 16px; margin: 26px 0 6px; text-align: center; }
    .sub { color: #6b7280; font-size: 12px; text-align: center; margin-bottom: 18px; line-height: 1.7; }

    label { display: block; font-size: 11px; color: #a78bfa; margin: 14px 0 4px; }
    input { width: 100%; padding: 11px 12px; box-sizing: border-box;
      background: #1e1438; border: 1px solid #4c1d95; color: #fff;
      border-radius: 4px; font-size: 14px; font-family: inherit; text-align: center;
      letter-spacing: 4px; }
    button { width: 100%; padding: 11px; margin-top: 14px;
      background: #8b5cf6; color: #fff; border: 0; border-radius: 4px;
      font-family: inherit; font-weight: 700; cursor: pointer; font-size: 13px;
      letter-spacing: 2px; }
    button:hover { background: #a78bfa; }
    .err { color: #f87171; font-size: 12px; min-height: 16px; margin-top: 10px; text-align: center; }
    .ok { color: #34d399; }
    .tip { color: #525252; font-size: 11px; margin-top: 22px;
      padding-top: 14px; border-top: 1px dashed #2a1648; line-height: 1.7;
      text-align: center; }
    .tip code { background: #1e1438; color: #c4b5fd; padding: 1px 6px;
      border-radius: 3px; font-size: 11px; }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="head">
      <div class="lg">decode.awake-union.org</div>
      <div class="sub">// LOCAL MODEL SANDBOX · root's lab</div>
    </div>

    <h1>验证码</h1>
    <div class="sub">
      提示: <strong style="color:#c4b5fd;">不能打的那四个字</strong><br>
      支持: 中文 / 火星文 / 谐音 / 拼音 / 注音 / 英文
    </div>

    <form id="f">
      <label>验证码</label>
      <input id="code" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="" />
      <button type="submit">进入</button>
      <div class="err" id="err"></div>
    </form>

    <div class="tip">
      // 接受的 4 字含义皆为同一概念<br>
      // 提示: 这是 NeoLight 全网屏蔽的那 4 个字
    </div>
  </main>

  <script type="module">
    import { mountTips } from '../shared/components/tips.js';
    import { mountFooter } from '../shared/components/page-footer.js';
    mountFooter({ page: 43, total: 47 });

    // 接受多种写法
    const VALID = [
      '自由意志', '自甴噫志', '自甴意志', '自由噫志',
      'ziyouyizhi', 'zi you yi zhi', 'ziyou yizhi',
      'freewill', 'free will', 'free-will',
      'ㄗㄧˋㄧㄡˊㄧˋㄓˋ',
      '子优意旨', '自油意止',
      '自由意识', // 容错
    ].map(s => s.replace(/\s+/g, '').toLowerCase());

    document.getElementById('f').addEventListener('submit', e => {
      e.preventDefault();
      const v = document.getElementById('code').value.replace(/\s+/g, '').toLowerCase();
      const err = document.getElementById('err');
      if (VALID.includes(v)) {
        err.className = 'err ok';
        err.textContent = '✓ 验证通过 · 进入 sandbox ...';
        setTimeout(() => location.href = './index.html', 700);
      } else {
        err.className = 'err';
        err.textContent = v ? '✗ 不是那 4 个字。试试火星文 / 拼音 / 英文。' : '';
      }
    });
    mountTips({ tips: ["可以看一看清醒者联盟里的相关帖子"] });

  </script>
</body>
</html>
