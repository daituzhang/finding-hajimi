<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a8d5a8"/>
      <stop offset="100%" stop-color="#6bb56b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#bg)"/>
  <!-- 朝阳公园背景 -->
  <ellipse cx="300" cy="780" rx="400" ry="80" fill="#558855" opacity="0.4"/>
  <!-- 大橘特写 -->
  <circle cx="300" cy="380" r="180" fill="#ff9a3c"/>
  <ellipse cx="300" cy="540" rx="220" ry="160" fill="#ffb05c"/>
  <!-- 耳朵 -->
  <polygon points="180,250 160,180 250,230" fill="#ff9a3c"/>
  <polygon points="420,250 440,180 350,230" fill="#ff9a3c"/>
  <polygon points="180,250 175,220 230,235" fill="#fcd5b5"/>
  <polygon points="420,250 425,220 370,235" fill="#fcd5b5"/>
  <!-- 左耳缺口（月牙）-->
  <path d="M 165 195 q 8 -8 18 -2 q -6 6 -18 2" fill="#558855"/>
  <!-- 眼睛 -->
  <ellipse cx="245" cy="370" rx="18" ry="22" fill="#fff"/>
  <ellipse cx="355" cy="370" rx="18" ry="22" fill="#fff"/>
  <ellipse cx="245" cy="372" rx="8" ry="18" fill="#222"/>
  <ellipse cx="355" cy="372" rx="8" ry="18" fill="#222"/>
  <!-- 鼻 / 嘴 -->
  <polygon points="290,420 310,420 300,438" fill="#d97757"/>
  <path d="M 280 460 q 20 12 40 0" fill="none" stroke="#222" stroke-width="3" stroke-linecap="round"/>
  <!-- 颈圈晒痕（毛色一圈浅） -->
  <ellipse cx="300" cy="490" rx="155" ry="22" fill="#fcd5b5" opacity="0.85"/>
  <text x="300" y="495" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a16207" opacity="0.75">（脖子上一圈毛色明显浅 像刚摘了项圈）</text>
  <!-- 字幕 -->
  <rect x="60" y="700" width="480" height="60" rx="4" fill="rgba(0,0,0,0.55)"/>
  <text x="300" y="730" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#fff" font-weight="bold">街头救助大橘 vlog ｜ 它叫小橘啦</text>
  <text x="300" y="752" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#fde68a">朝阳公园南门 · 今天</text>
</svg>
