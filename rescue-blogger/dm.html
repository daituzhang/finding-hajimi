<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>私信 · @朝阳救助小柚</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="../shared/styles/shared.css" />
  <style>
    .dm-input { gap: 6px; align-items: stretch; padding: 10px 12px; }
    .dm-input .draft {
      flex: 1; background: #fff; border: 1px solid #e5e5e5; border-radius: 8px;
      padding: 8px 10px; font-size: 13px; color: #222; line-height: 1.5;
      min-height: 38px; max-height: 110px; overflow-y: auto; white-space: pre-wrap;
      cursor: text;
    }
    .dm-input .send-btn {
      background: #ff2442; color: #fff; border: none; border-radius: 8px;
      padding: 0 14px; font-size: 13px; cursor: pointer; align-self: stretch;
      min-width: 56px;
    }
    .dm-input .send-btn:disabled { background: #ddd; color: #999; cursor: not-allowed; }
    .typing {
      align-self: flex-start; padding: 10px 14px; background: #fff;
      border-radius: 14px; color: #999; font-size: 13px; margin: 4px 0;
    }
    .typing span { display: inline-block; width: 4px; height: 4px; background: #999;
      border-radius: 50%; margin: 0 1px; animation: blink 1.4s infinite; }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%, 60%, 100% { opacity: 0.2; } 30% { opacity: 1; } }
    .dm-bubble.them a {
      color: #2563eb; text-decoration: underline; word-break: break-all;
    }
    .ended-banner {
      background: #dcfce7; color: #166534; padding: 10px 14px;
      border-radius: 10px; font-size: 13px; text-align: center;
      margin: 14px 16px;
    }
  </style>
</head>
<body class="dm-app">
  <main class="app" style="background:#f6f6f6;">
    <header class="dm-header">
      <button class="back" type="button" onclick="history.back()">‹</button>
      <div class="name">@朝阳救助小柚</div>
      <div class="stat">在线 · 一般 1 小时内回复</div>
    </header>

    <div class="dm-list" id="dmList">
      <div class="dm-time">今天</div>

      <div class="dm-bubble them">
        姐妹好呀～ 收到你的关注啦
有什么事情可以直接说😊
      </div>
    </div>

    <div class="dm-input">
      <div class="draft" id="draft" contenteditable="true" spellcheck="false"></div>
      <button class="send-btn" id="sendBtn">发送</button>
    </div>
  </main>

  <script type="module">
    import { mountFooter } from '../shared/components/page-footer.js';
    mountFooter({ page: 19, total: 20 });
  </script>

  <script>
    (function () {
      const list = document.getElementById('dmList');
      const draft = document.getElementById('draft');
      const sendBtn = document.getElementById('sendBtn');

      // 玩家视角的预设对话剧本
      const script = [
        {
          preset:
'姐妹你好🙏 我前天在朝阳公园南门那块捡到一只大橘\n刚刚刷到你今天发的"街头救助大橘"那条 vlog\n你视频里那只猫脖子上有圈很明显的项圈晒痕 + 左耳一道月牙缺口\n这两个特征跟另一个博主 @橘座妈不在家 三天前发的寻猫帖完全一致\n她家猫叫哈基米 芯片号 HJM427-2024\n方便的话 能不能麻烦你帮忙联系一下她？我怕私信她她不一定看得到🥹',
          replies: [
            { delay: 1200, text: '啊…… 我看了一下你说的那个寻猫帖 真的对得上😱' },
            { delay: 1400, text: '我以为它是被丢的 在公园等了 20 分钟没人来才带走的\n真的对不起 我先去联系她 你稍等我一下🙏' },
          ],
        },
        {
          preset: '没事姐妹 你也是好心 联系上之后能不能告诉我一声 我也想知道结果🥹',
          replies: [
            { delay: 2400, text: '稍等我十分钟' },
            { delay: 8000, text: '联系上啦！ 她现在已经在过来路上了😭' },
            { delay: 1200, text: '她让我代她谢谢你🙏 说等下她会发一条回家贴' },
            {
              delay: 1500,
              html: '刚刚她发了 给你看一下 ↓<br /><a href="../finale/" target="_blank" rel="noreferrer">📖 @橘座妈不在家 ｜ 哈基米回家了！</a>',
            },
          ],
          end: true,
        },
      ];

      let step = 0;

      function scrollBottom() {
        list.scrollTop = list.scrollHeight;
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
      }

      function setDraft(text) {
        draft.textContent = text;
      }

      function showTyping() {
        const el = document.createElement('div');
        el.className = 'typing';
        el.innerHTML = '<span></span><span></span><span></span>';
        list.appendChild(el);
        scrollBottom();
        return el;
      }

      function pushBubble(text, html) {
        const el = document.createElement('div');
        el.className = 'dm-bubble them';
        if (html) el.innerHTML = html;
        else el.textContent = text;
        list.appendChild(el);
        scrollBottom();
      }

      function pushMine(text) {
        const el = document.createElement('div');
        el.className = 'dm-bubble me';
        el.textContent = text;
        list.appendChild(el);
        const status = document.createElement('div');
        status.className = 'dm-status';
        status.textContent = '已读 · 刚刚';
        list.appendChild(status);
        scrollBottom();
      }

      async function runReplies(replies) {
        for (const r of replies) {
          const t = showTyping();
          await new Promise((res) => setTimeout(res, r.delay));
          t.remove();
          pushBubble(r.text, r.html);
        }
      }

      function loadStep() {
        if (step >= script.length) return;
        setDraft(script[step].preset);
        sendBtn.disabled = false;
        sendBtn.textContent = '发送';
      }

      sendBtn.addEventListener('click', async () => {
        if (sendBtn.disabled) return;
        const text = (draft.innerText || draft.textContent || '').trim();
        if (!text) return;
        sendBtn.disabled = true;
        pushMine(text);
        setDraft('');

        const cur = script[step];
        await runReplies(cur.replies);

        if (cur.end) {
          const banner = document.createElement('div');
          banner.className = 'ended-banner';
          banner.textContent = '🎉 哈基米已找到 · 三天的搜寻结束了';
          list.appendChild(banner);
          sendBtn.textContent = '已结束';
          draft.contentEditable = 'false';
          draft.style.color = '#aaa';
          setDraft('（对话已结束）');
          scrollBottom();
          return;
        }

        step++;
        loadStep();
      });

      loadStep();
    })();
  </script>
</body>
</html>
