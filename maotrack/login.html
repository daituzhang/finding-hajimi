<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>主人登录 · MaoTrack</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="../shared/styles/shared.css" />
</head>
<body>
  <main class="mt-app">
    <header class="mt-header">
      <svg class="logo" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <circle cx="32" cy="28" r="10" fill="none" stroke="#fff" stroke-width="3"/>
        <path d="M32 38 L32 50" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      </svg>
      <div>
        <div class="brand">MaoTrack</div>
        <div class="sub">主人登录</div>
      </div>
    </header>

    <nav class="mt-nav">
      <a target="_blank" rel="noreferrer" href="./">首页</a>
      <a target="_blank" rel="noreferrer" href="./cases.html">救助案例</a>
      <a target="_blank" rel="noreferrer" class="cta active" href="./login.html">主人登录</a>
    </nav>

    <section class="mt-login">
      <h2>查看您家宝贝当前位置</h2>
      <form id="mt-login">
        <div class="field">
          <label>账号 · 项圈芯片号</label>
          <input id="mt-acct" type="text" placeholder="请输入项圈芯片号" />
          <div class="hint">格式 XXX####-####（短横线一个，全大写）</div>
        </div>
        <div class="field">
          <label>密码 · 您家宝贝的生日</label>
          <input id="mt-pwd" type="text" placeholder="YYMMDD（6 位数字）" maxlength="6" />
          <div class="hint">填您家宝贝生日 · 6 位数字</div>
        </div>
        <button type="submit">登录</button>
        <div class="err" id="mt-err"></div>
      </form>

      <div class="alt">
        <a target="_blank" rel="noreferrer" href="./cases.html">看其他成功找回案例</a>
        <span>·</span>
      </div>
    </section>

    <div class="mt-foot">© 2026 MaoTrack</div>
  </main>

  <script type="module">
    import { mountTips } from '../shared/components/tips.js';
    import { mountFooter } from '../shared/components/page-footer.js';
    mountFooter({ page: 12, total: 20, keywords: ['MaoTrack', '登录'] });
    mountTips({ tips: ["猫猫的照片里好像一直挂着芯片，会不会有什么线索", "好像在失主小红书里看到过哈基米生日的笔记呢", "失主小红书主页好像会显示加入小红书的年份", "也许小猫病历里有日期的线索", "大部分的流浪猫都是在被收养的那天打的疫苗"] });

  </script>
  <script>
    const form = document.getElementById('mt-login');
    const acct = document.getElementById('mt-acct');
    const pwd = document.getElementById('mt-pwd');
    const err = document.getElementById('mt-err');

    let fails = 0;

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const a = acct.value.trim().toUpperCase();
      const p = pwd.value.trim();
      if (a === 'HJM427-2024' && p === '230502') {
        location.href = './dashboard.html';
        return;
      }
      fails++;
      if (!a || !p) err.textContent = '请填写账号和密码。';
      else err.textContent = '账号或密码错误，请重试。';
    });
  </script>
</body>
</html>
