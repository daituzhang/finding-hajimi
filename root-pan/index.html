<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>我的网盘 / · pan.root.lab</title>
  <link rel="icon" type="image/png" href="../shared/assets/favicon.png" />
  <link rel="stylesheet" href="../shared/styles/shared.css" />
  <style>
    body { background: #f5f7fa; color: #333; margin: 0;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; min-height: 100vh; }
    /* 顶部白色导航 */
    .topbar {
      background: #fff; padding: 0 20px; height: 54px;
      display: flex; align-items: center; gap: 18px;
      border-bottom: 1px solid #ebedf0; box-shadow: 0 1px 0 rgba(0,0,0,0.02);
    }
    .topbar .brand {
      font-size: 18px; font-weight: 700; color: #06a7ff;
      letter-spacing: 1px;
    }
    .topbar .brand small { color: #999; font-size: 11px; font-weight: normal; margin-left: 6px; }
    .topbar .nav { display: flex; gap: 22px; font-size: 14px; color: #555; }
    .topbar .nav .it { cursor: pointer; padding: 4px 0; }
    .topbar .nav .it.on { color: #06a7ff; border-bottom: 2px solid #06a7ff; }
    .topbar .right { margin-left: auto; display: flex; align-items: center; gap: 12px; font-size: 13px; color: #666; }
    .topbar .ip-tag {
      background: #fff5f5; color: #f56c6c; border: 1px solid #fde2e2;
      padding: 1px 8px; border-radius: 10px; font-size: 11px;
      font-family: ui-monospace, monospace;
    }
    .topbar .avatar {
      width: 28px; height: 28px; border-radius: 50%;
      background: #06a7ff; color: #fff; display: inline-flex;
      align-items: center; justify-content: center; font-size: 12px;
    }

    /* 主体：左侧导航 + 右侧内容 */
    .main { display: flex; max-width: 1200px; margin: 0 auto; }
    .side {
      width: 180px; background: #fff; border-right: 1px solid #ebedf0;
      min-height: calc(100vh - 54px); padding: 16px 0;
    }
    .side .item {
      padding: 10px 22px; font-size: 14px; color: #444;
      cursor: pointer; display: flex; align-items: center; gap: 10px;
      border-left: 3px solid transparent;
    }
    .side .item:hover { background: #f3f9ff; }
    .side .item.active {
      color: #06a7ff; background: #ecf5ff; border-left-color: #06a7ff; font-weight: 600;
    }
    .side .item .ic { width: 18px; text-align: center; }
    .side .quota {
      margin: 28px 16px 0; padding: 12px; background: #f7f9fc;
      border-radius: 6px; font-size: 11px; color: #888;
    }
    .side .quota .bar { height: 4px; background: #e6ebf2; border-radius: 2px; margin-top: 6px; overflow: hidden; }
    .side .quota .bar i { display: block; height: 100%; width: 17%; background: #06a7ff; }

    /* 右侧 */
    .content { flex: 1; padding: 18px 22px; }
    .crumb { font-size: 13px; color: #888; margin-bottom: 14px; }
    .crumb a { color: #06a7ff; text-decoration: none; cursor: pointer; }
    .crumb .sep { margin: 0 6px; color: #ccc; }

    /* 工具栏（百度网盘风：上传 / 新建 / 下载 / 分享 / 删除）*/
    .toolbar {
      background: #fff; padding: 8px 12px; border-radius: 6px;
      display: flex; gap: 6px; margin-bottom: 12px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .toolbar .btn {
      padding: 6px 14px; font-size: 13px; color: #555; cursor: pointer;
      border-radius: 4px; display: inline-flex; align-items: center; gap: 4px;
    }
    .toolbar .btn:hover { background: #f3f9ff; color: #06a7ff; }
    .toolbar .btn.primary { background: #06a7ff; color: #fff; }
    .toolbar .btn.primary:hover { background: #0089dd; color: #fff; }
    .toolbar .sep { width: 1px; background: #ebedf0; margin: 4px 6px; }

    /* 文件列表 */
    .list { background: #fff; border-radius: 6px; overflow: hidden;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
    .list .head {
      display: grid; grid-template-columns: 36px 1fr 110px 130px 90px;
      padding: 10px 14px; background: #fafbfc; color: #999;
      font-size: 12px; border-bottom: 1px solid #f0f2f5;
    }
    .row {
      display: grid; grid-template-columns: 36px 1fr 110px 130px 90px;
      padding: 10px 14px; border-bottom: 1px solid #f3f4f7;
      font-size: 13px; color: #333; cursor: pointer; align-items: center;
      text-decoration: none;
    }
    .row:hover { background: #f3f9ff; }
    .row .name { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .row .name .ic {
      width: 28px; height: 28px; border-radius: 4px; flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 18px; background: #f3f9ff;
    }
    .row .name .ic.folder { background: #fff8e6; }
    .row .name .ic.broken { background: #fef0f0; }
    .row .name .t { color: #333; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row .size, .row .mtime, .row .actions { color: #999; font-size: 12px; }
    .row .actions a { color: #06a7ff; margin-right: 10px; text-decoration: none; }
    .row.broken .name .t { color: #f56c6c; }
    .row.broken .name .t::after {
      content: ' [损坏]'; font-size: 11px; color: #f56c6c; opacity: 0.85;
      font-family: ui-monospace, monospace;
    }
    .checkbox {
      width: 14px; height: 14px; border: 1px solid #c0c4cc; border-radius: 2px;
      background: #fff;
    }

    .toast {
      position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%);
      background: #fff; color: #f56c6c; border: 1px solid #fde2e2;
      padding: 14px 22px; border-radius: 6px; font-size: 13px;
      max-width: 360px; text-align: center; line-height: 1.6;
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
      display: none; z-index: 100;
    }
    .toast.show { display: block; }
    .toast strong { color: #06a7ff; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">pan.root.lab <small>· 让数据安心存放</small></div>
    <nav class="nav">
      <div class="it on">首页</div>
      <div class="it">我的分享</div>
      <div class="it">传输列表</div>
    </nav>
    <div class="right">
      <span class="ip-tag" id="ipTag">ip:?</span>
      <span>root</span>
      <span class="avatar">R</span>
    </div>
  </header>

  <div class="main">
    <aside class="side">
      <div class="item active"><span class="ic">📁</span>我的网盘</div>
      <div class="item"><span class="ic">🔗</span>我的分享</div>
      <div class="item"><span class="ic">⬇</span>离线下载</div>
      <div class="item"><span class="ic">🗑</span>回收站</div>
      <div class="quota">
        容量 1.7 GB / 10 GB
        <div class="bar"><i></i></div>
      </div>
    </aside>

    <main class="content">
      <div class="crumb">
        <a id="crumbRoot">全部文件</a>
        <span class="sep">›</span>
        <span>/</span>
      </div>

      <div class="toolbar">
        <span class="btn primary">⬆ 上传</span>
        <span class="btn">＋ 新建文件夹</span>
        <span class="sep"></span>
        <span class="btn">⬇ 下载</span>
        <span class="btn">🔗 分享</span>
        <span class="btn">⮕ 移动</span>
        <span class="btn">🗑 删除</span>
      </div>

      <div class="list">
        <div class="head">
          <div></div><div>文件名</div><div>大小</div><div>修改日期</div><div></div>
        </div>

        <a class="row broken" id="brokenFile" href="#">
          <span class="checkbox"></span>
          <div class="name"><span class="ic broken">📄</span><span class="t">invite.pdf</span></div>
          <div class="size">14.7 KB</div>
          <div class="mtime">2026-01-08</div>
          <div class="actions">下载</div>
        </a>
        <a class="row" href="#" onclick="return false;">
          <span class="checkbox"></span>
          <div class="name"><span class="ic">🎮</span><span class="t">game-2077.torrent</span></div>
          <div class="size">22 KB</div>
          <div class="mtime">2026-05-21</div>
          <div class="actions">下载</div>
        </a>
        <a class="row" href="./investigation.html?ip=192.0.2.77" target="_blank" rel="noreferrer">
          <span class="checkbox"></span>
          <div class="name"><span class="ic folder">📁</span><span class="t">investigation/</span></div>
          <div class="size">— —</div>
          <div class="mtime">今天</div>
          <div class="actions">打开</div>
        </a>
      </div>
    </main>
  </div>

  <div class="toast" id="toast">
    文件已损坏，需要<strong>修复网盘文件</strong>。
  </div>

  <script type="module">
    import { mountTips } from '../shared/components/tips.js';
    import { mountFooter } from '../shared/components/page-footer.js';
    mountFooter({ page: 21, total: 46 });

    const ip = new URLSearchParams(location.search).get('ip') || '192.0.2.77';
    document.getElementById('ipTag').textContent = `ip:${ip}`;
    document.getElementById('crumbRoot').href = `./index.html?ip=${ip}`;

    const toast = document.getElementById('toast');
    document.getElementById('brokenFile').addEventListener('click', e => {
      e.preventDefault();
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 4500);
    });
    mountTips({ tips: ["可以先找找有什么可以打开的文件", "损坏文件我们可以搜搜修复工具"] });

  </script>
</body>
</html>
