<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>find.cn — 你想找的，都在这里</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="/shared/styles/shared.css" />
</head>
<body>
  <header class="topbar">
    <div class="logo">find<span>.</span>cn</div>
    <nav class="topnav">
      <a href="#">首页</a>
      <a href="#">资讯</a>
      <a href="#">视频</a>
      <a href="#">登录</a>
    </nav>
  </header>

  <div class="layout">
    <main id="app" class="container"></main>

    <aside class="side-notes" id="sideNotes">
      <div class="note-card" data-key="hint-hjm">
        <div class="note-pin">📌</div>
        <div class="note-title">小贴士 #1</div>
        <div class="note-body">不知道从哪开始？<br />可以先搜「<b>哈基米</b>」试试。</div>
      </div>
      <div class="note-card">
        <div class="note-pin">🔢</div>
        <div class="note-title">小贴士 #2</div>
        <div class="note-body">每个页面右下角都有 <code>XX/14</code> 序号。<br /><b>数字越大 越接近真相。</b></div>
      </div>
      <div class="note-card">
        <div class="note-pin">🌿</div>
        <div class="note-title">小贴士 #3</div>
        <div class="note-body"><code>extra-XX</code> 是支线页面 · 里面没有关键词、也没有关键链接，<br /><b>不看不影响主线进度</b>。</div>
      </div>
      <div class="note-card">
        <div class="note-pin">🔍</div>
        <div class="note-title">小贴士 #4</div>
        <div class="note-body">06 页的群聊搜索框只认 <b>唯一一个关键词</b>，<br />别的输什么都是「搜不到」。</div>
      </div>
    </aside>
  </div>

  <footer class="page-foot">
    <div class="brand-strip">
      <img src="/shared/assets/neolight-logo.png" alt="NeoLight" />
      <span>find.cn 由 <strong>新光科技 NeoLight</strong> 出品 · 一站式信息检索</span>
    </div>
    <div>© 2026 NeoLight · find.cn  ·  使用前请阅读用户协议</div>
    <div class="hot">今日热搜：哈基米丢了 · 朝阳猫圈 · MaoTrack 评测</div>
  </footer>

  <script type="module">
    import { mountSearch } from '/shared/components/search-engine.js';
    import { mountFooter } from '/shared/components/page-footer.js';
    import { config } from './config.js';

    mountSearch({ config, rootSelector: '#app' });
    mountFooter({ tool: true });

    // 哈基米已搜过 → 隐藏第一条小贴士
    try {
      const hist = JSON.parse(localStorage.getItem('arg.search_history.find.cn') || '[]');
      if (hist.some(h => /哈基米/.test(h))) {
        const c = document.querySelector('[data-key="hint-hjm"]');
        if (c) c.remove();
      }
    } catch {}
  </script>
</body>
</html>
